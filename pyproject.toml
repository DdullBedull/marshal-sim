[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marshal-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "gpxpy", "matplotlib", "fastapi", "uvicorn", "python-multipart"]

[tool.setuptools.packages.find]
where = ["src"]